<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>余烬农场</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315191d'/%3E%3Cpath d='M16 4c2 6 8 8 8 15a8 8 0 01-16 0c0-3 2-5 3-6 0 3 2 5 3 5 0-5-2-8 2-14z' fill='%23f2a93b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app">
  <canvas id="world" tabindex="0" aria-label="游戏画面：WASD 移动，E 交互，鼠标左键使用手上的东西"></canvas>
  <div id="flash" aria-hidden="true"></div>
  <div id="hud" class="ui" hidden>
    <header id="topbar"><div id="res" role="group" aria-label="营地的资源"></div><div id="clock"></div></header>
    <div id="respop" role="dialog" aria-label="从哪来到哪去" hidden></div>
    <div id="banner" role="status" hidden></div>
    <div id="bossbar" role="status" hidden></div>
    <div id="coach" role="status" hidden></div>
    <aside id="alerts" aria-label="要处理的事"></aside>
    <div id="hint" role="status" hidden></div>
    <div id="bark" role="status" hidden></div>
    <div id="tip" role="status" hidden></div>
    <button id="goal" data-act="page" data-id="journal" aria-label="眼下的目标，点开手记"></button>
    <div id="hands"><div id="handlabel"></div><div id="vitals"></div><div id="hotbar" role="group" aria-label="手上的东西"></div></div>
    <nav id="dock" aria-label="营地"></nav>
  </div>
  <div id="over" class="ui" hidden>
    <div id="scrim" hidden></div>
    <section id="drawer" role="dialog" aria-label="建造" hidden></section>
    <section id="page" role="dialog" aria-modal="true" hidden></section>
    <section id="card" role="dialog" aria-modal="true" hidden></section>
  </div>
  <div id="scene" class="ui" hidden></div>
  <div id="top" class="ui"><div id="toasts" aria-live="polite"></div></div>
  <div id="loading"><div class="name">余烬农场</div><p class="mut" data-release></p><p class="mut" id="loading-text">正在整理种子和行囊…</p></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
